services:
  luma-nav:
    build: .
    container_name: luma-nav
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: change-this-to-a-random-long-string
      ADMIN_PASSWORD: change-me-before-first-run
      UPDATE_FEED_URL: ${UPDATE_FEED_URL:-https://api.github.com/repos/yangzhen72/luma-nav/contents/CHANGELOG.md?ref=main}
      UPDATE_GIT_REMOTE: ${UPDATE_GIT_REMOTE:-https://github.com/yangzhen72/luma-nav.git}
      UPDATE_FEED_TOKEN: ""
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads


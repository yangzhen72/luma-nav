services:
  luma-nav:
    build: .
    container_name: luma-nav
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: change-this-to-a-random-long-string
      ADMIN_PASSWORD: change-me-before-first-run
      UPDATE_FEED_URL: ${UPDATE_FEED_URL:-https://gitlab.yangzheng.xin/root/luma-nav/-/raw/main/CHANGELOG.md}
      UPDATE_FEED_TOKEN: ""
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

